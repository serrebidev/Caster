name: Cloud Release

# Cloud agents ONLY. On the Windows release host run `py release.py patch`.
# Windows runs the same release.py on a GitHub runner (bump, commit, tag,
# PyInstaller, ffmpeg, Caster-portable.zip, GitHub release). macOS and Linux
# then build that tag with build.sh and attach Caster-macos.zip and
# Caster-linux-x86_64.tar.gz.
#
#   gh workflow run cloud-release.yml -f dry_run=true                 # build all, publish nothing
#   gh workflow run cloud-release.yml -f dry_run=false -f bump=patch  # real release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every platform as workflow artifacts; push, tag and publish nothing
        required: false
        default: true
        type: boolean
      bump:
        description: Version part to bump (release.py argument)
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Require master
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::Cloud releases run from master only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install pyinstaller pytest -r requirements.txt

      - name: Test
        run: python -m pytest -q

      # release.py copies the first `where ffmpeg` hit beside Caster.exe;
      # Chocolatey's shim must not be that hit, so put the real binary first.
      - name: Install ffmpeg
        run: |
          choco install ffmpeg --no-progress -y
          $real = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $real) { throw "ffmpeg.exe not found after install" }
          $real.DirectoryName >> $env:GITHUB_PATH

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: python release.py --no-bump

      - name: Release
        if: ${{ !inputs.dry_run }}
        run: python release.py ${{ inputs.bump }}

      - name: Record tag
        id: tag
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            tag="$(git describe --tags --exact-match HEAD)"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: Caster-windows
          path: dist/Caster-portable.zip
          if-no-files-found: error

  unix:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: Caster-macos.zip
          - os: ubuntu-24.04
            asset: Caster-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.windows.outputs.ref }}

      - uses: actions/setup-python@v6
        if: ${{ runner.os == 'macOS' }}
        with:
          python-version: "3.14"

      # wxPython has no Linux pip wheel; use Ubuntu's in a venv that sees it.
      - name: Prepare Linux Python
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-wxgtk4.0 ffmpeg xvfb
          python3 -m venv --system-site-packages .venv
          echo "PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Launch check
        if: ${{ runner.os == 'Linux' }}
        run: |
          set +e
          HOME="$RUNNER_TEMP" timeout 15 xvfb-run -a dist/Caster/Caster
          [ $? = 124 ] || { echo "::error::Caster exited before 15 s"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        run: gh release upload "${{ needs.windows.outputs.tag }}" "dist/${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"
