name: macOS Release

# The Windows release host builds Windows locally and Linux over SSH; this is
# its macOS half, dispatched by tools/release_other_platforms.py once the
# release is published. (cloud-release.yml has its own macOS job.)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build the macOS app for and attach it to
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        run: ./build.sh

      - name: Attach to release
        run: |
          cp "dist/Caster-macos.zip" "Caster-macos.zip"
          api="https://git.serrebiradio.com/api/v1/repos/serrebi/Caster"
          h="Authorization: token $FORGEJO_TOKEN"
          release="$(curl -sf -H "$h" "$api/releases/tags/$TAG")"
          id="$(echo "$release" | jq -r .id)"
          old="$(echo "$release" | jq -r '.assets[] | select(.name == "Caster-macos.zip") | .id')"
          [ -z "$old" ] || curl -sf -X DELETE -H "$h" "$api/releases/$id/assets/$old"
          curl -sf -o /dev/null -H "$h" -F "attachment=@Caster-macos.zip" "$api/releases/$id/assets?name=Caster-macos.zip"
